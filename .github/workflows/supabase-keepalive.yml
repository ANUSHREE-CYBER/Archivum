# Pings the Supabase REST API on a schedule to prevent the free-tier
# project from auto-pausing after ~7 days of inactivity. Without this,
# the first request after a pause takes 30-60s to wake the project,
# which shows up as a blank screen on load for whoever hits it first.
name: Supabase Keepalive

on:
  schedule:
    - cron: '0 0 */3 * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Query entries table
        run: |
          curl --fail --silent --show-error \
            "$SUPABASE_URL/rest/v1/entries?select=id&limit=1" \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY"
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
